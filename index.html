<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Golden Car Service — Especialista em câmbio automático</title>
    <meta
      name="description"
      content="Especialista em troca de óleo de câmbio automático, reparos no câmbio, mecânica em geral, suspensão, motor, freios e performance."
    />
    <link rel="canonical" href="https://goldencarservice.com.br" />

    <!--
      Open Graph / Twitter Card — sem essas tags o link nao mostra preview
      nenhum ao compartilhar (WhatsApp, redes sociais). og-image.jpg é a
      fachada real da oficina (src/assets/insta/oficina-fachada.webp),
      composta com a tagline — ver plano/sessao de auditoria.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://goldencarservice.com.br" />
    <meta property="og:title" content="Golden Car Service — Especialista em câmbio automático" />
    <meta
      property="og:description"
      content="Especialista em troca de óleo de câmbio automático, reparos no câmbio, mecânica em geral, suspensão, motor, freios e performance."
    />
    <meta property="og:image" content="https://goldencarservice.com.br/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Golden Car Service — Especialista em câmbio automático" />
    <meta
      name="twitter:description"
      content="Especialista em troca de óleo de câmbio automático, reparos no câmbio, mecânica em geral, suspensão, motor, freios e performance."
    />
    <meta name="twitter:image" content="https://goldencarservice.com.br/og-image.jpg" />

    <!--
      Tracking do Google Ads e do Meta Pixel.
      Os snippets ficam comentados ate o cliente informar os IDs. Ao ativar,
      preencher tambem site.tracking em src/data/site.ts — e de la que
      trackContactClick() decide se dispara.
    -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
